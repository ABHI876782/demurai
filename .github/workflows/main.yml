name: Build Dimurai APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Find project folder
        id: find
        run: |
          FILE=$(find . -name "settings.gradle.kts" -not -path "./.git/*" | head -n 1)
          if [ -z "$FILE" ]; then
            echo "ERROR: settings.gradle.kts nahi mili. Project files upload nahi hui hain."
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Project folder: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: cp app/build/outputs/apk/debug/app-debug.apk Dimurai.apk

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Dimurai-APK
          path: ${{ steps.find.outputs.dir }}/Dimurai.apk

      - name: Publish APK in Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Dimurai APK #${{ github.run_number }}
          files: ${{ steps.find.outputs.dir }}/Dimurai.apk
